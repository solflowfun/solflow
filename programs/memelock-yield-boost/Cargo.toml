[package]
name = "memelock-yield-boost"
version = "0.1.0"
description = "MemeLock Yield Boost - Buy-price fee + matched SOL staking yield"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "memelock_yield_boost"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token", "token_2022", "associated_token"] }
solana-program = "1.18"
memelock-core = { path = "../memelock-core", features = ["cpi"] }

[dev-dependencies]
solana-program-test = "1.18"
solana-sdk = "1.18"
tokio = "1.0"

